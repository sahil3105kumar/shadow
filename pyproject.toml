[project]
name = "shadow"
version = "0.1.0"
description = "A local-first cognitive operating system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pre-commit>=4.6.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "rich>=15.0.0",
    "ruff>=0.15.22",
    "structlog>=26.1.0",
    "typer>=0.27.0",
    "types-PyYAML>=6.0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
